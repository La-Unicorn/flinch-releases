<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" width="96" height="80" fill="none" role="img" aria-label="Thinking" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Colors from the landing page: orange #df8a5e, cream #fae9d4 -->

  <!-- bar 1 · orange -->
  <rect x="0" y="6" width="6" height="28" rx="3" fill="#df8a5e">
    <animate attributeName="height" values="28;14;36;28" dur="1.2s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="6;13;2;6" dur="1.2s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  </rect>

  <!-- bar 2 · cream -->
  <rect x="14" y="0" width="6" height="40" rx="3" fill="#fae9d4">
    <animate attributeName="height" values="40;18;32;40" dur="1s" begin="-0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="0;11;4;0" dur="1s" begin="-0.3s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  </rect>

  <!-- bar 3 · orange -->
  <rect x="28" y="10" width="6" height="20" rx="3" fill="#df8a5e">
    <animate attributeName="height" values="20;38;14;20" dur="1.3s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="10;1;13;10" dur="1.3s" begin="-0.6s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  </rect>

  <!-- bar 4 · cream -->
  <rect x="42" y="4" width="6" height="32" rx="3" fill="#fae9d4">
    <animate attributeName="height" values="32;12;40;32" dur="1.1s" begin="-0.15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="y" values="4;14;0;4" dur="1.1s" begin="-0.15s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/>
  </rect>
</svg>
