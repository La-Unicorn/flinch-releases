<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flinch Visual Explain — Debug Studio</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="whiteboard.css">
  <style>
    body {
      background: #0B0F19;
      display: flex;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    .debug-sidebar {
      width: 440px;
      height: 100%;
      background: #0F172A;
      border-right: 1.5px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      z-index: 20;
    }

    .debug-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .debug-title {
      font-size: 15px;
      font-weight: 700;
      color: #3DDC84;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preset-select {
      background: #1E293B;
      color: #E2E8F0;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      outline: none;
      cursor: pointer;
    }

    .editor-section {
      flex: 1;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    .editor-label {
      font-size: 12px;
      color: #94A3B8;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }

    .json-textarea {
      flex: 1;
      width: 100%;
      background: #090D16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 14px;
      color: #38BDF8;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 12.5px;
      line-height: 1.45;
      resize: none;
      outline: none;
      white-space: pre;
    }

    .json-textarea:focus {
      border-color: #3DDC84;
      box-shadow: 0 0 12px rgba(61, 220, 132, 0.2);
    }

    .debug-controls {
      padding: 16px 20px;
      background: #111827;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls-row {
      display: flex;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #94A3B8;
    }

    .slider-row input {
      width: 180px;
    }

    .debug-status {
      font-size: 12px;
      color: #EF4444;
      min-height: 18px;
    }

    .debug-status.ok {
      color: #3DDC84;
    }

    /* Stage Area */
    .debug-stage {
      flex: 1;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #060911;
      position: relative;
    }

    .stage-card {
      width: 1000px;
      height: 680px;
      max-width: 95%;
      max-height: 92%;
    }

    /* Screen Highlight Mini-Radar */
    .screen-highlight-badge {
      position: absolute;
      top: 16px;
      right: 24px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38BDF8;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: #BAE6FD;
      display: none;
      align-items: center;
      gap: 8px;
      z-index: 100;
    }

    .floating-close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94A3B8;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 50;
      transition: all 0.2s;
    }

    .floating-close-btn:hover {
      background: rgba(248, 113, 113, 0.25);
      color: #F87171;
    }
  </style>
</head>
<body>
  <!-- Sidebar Editor & Presets -->
  <div class="debug-sidebar">
    <div class="debug-header">
      <div class="debug-title">
        <span>🧪</span>
        <span>Visual Explain Studio</span>
      </div>
      <select id="presetSelect" class="preset-select">
        <option value="pemdas">Preset: 6 ÷ 2(1+2)</option>
        <option value="pythagoras">Preset: Pythagorean Theorem</option>
        <option value="quadratic">Preset: Quadratic & Curve</option>
        <option value="geometry">Preset: Angle & Triangles</option>
        <option value="numberline">Preset: Number Line</option>
      </select>
    </div>

    <div class="editor-section">
      <div class="editor-label">Paste / Edit JSON Schema (0-1000 space)</div>
      <textarea id="jsonInput" class="json-textarea" spellcheck="false"></textarea>
      <div id="statusMsg" class="debug-status ok">JSON Schema valid</div>
    </div>

    <div class="debug-controls">
      <div class="slider-row">
        <span>Step Duration:</span>
        <input type="range" id="durationSlider" min="1000" max="8000" step="200" value="3200">
        <span id="durationVal">3.2s</span>
      </div>
      <div class="controls-row">
        <button class="ctrl-btn primary" id="dbgPlayBtn" style="flex: 2;">▶ Play Animation</button>
        <button class="ctrl-btn" id="dbgPrevBtn">⏮</button>
        <button class="ctrl-btn" id="dbgNextBtn">⏭</button>
        <button class="ctrl-btn" id="dbgClearBtn">Clear</button>
      </div>
    </div>
  </div>

  <!-- Stage Whiteboard -->
  <div class="debug-stage">
    <div id="screenHlBadge" class="screen-highlight-badge">
      <span>🎯</span>
      <span id="screenHlText">Screen Target</span>
    </div>

    <div class="whiteboard-container stage-card">
      <button class="floating-close-btn" id="closeBtn" title="Close">✕</button>

      <div class="whiteboard-canvas-wrapper">
        <svg id="wbSvg" class="whiteboard-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      </div>

      <div class="whiteboard-narration">
        <div class="narration-text" id="narrationText">Click "Play Animation" or paste a custom JSON on the left...</div>
        <div class="controls-cluster">
          <span id="stepCounter" style="font-size: 12px; color: #94A3B8;">Ready</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Local Bundled Libraries -->
  <script src="vendor/rough.min.js"></script>
  <script src="vendor/katex/katex.min.js"></script>

  <!-- Whiteboard Engine -->
  <script src="engine/utils.js"></script>
  <script src="engine/layout.js"></script>

  <!-- Primitives -->
  <script src="engine/primitives/text.js"></script>
  <script src="engine/primitives/line_arrow.js"></script>
  <script src="engine/primitives/circle_rect.js"></script>
  <script src="engine/primitives/triangle.js"></script>
  <script src="engine/primitives/angle_arc.js"></script>
  <script src="engine/primitives/path.js"></script>
  <script src="engine/primitives/underline_highlight.js"></script>
  <script src="engine/primitives/brace.js"></script>
  <script src="engine/primitives/point.js"></script>
  <script src="engine/primitives/axes_number_line.js"></script>
  <script src="engine/primitives/check_cross.js"></script>
  <script src="engine/primitives/screen_highlight.js"></script>

  <!-- Player -->
  <script src="engine/player.js"></script>

  <script>
    // Calibrated presets with mathematical visual alignment in 0-1000 space
    const PRESETS = {
      pemdas: {
        "steps": [
          {
            "narration": "First, locate the problem on screen and evaluate parentheses: 1 plus 2 is 3.",
            "draw": [
              { "type": "highlight_on_screen", "x": 380, "y": 420, "w": 240, "h": 120, "label": "6 ÷ 2(1+2) =" },
              { "type": "text", "text": "6 \\div 2(1 + 2) = ?", "x": 100, "y": 120, "size": 32, "color": "#F8FAFC" },
              { "type": "circle", "cx": 248, "cy": 120, "r": 58, "color": "#3DDC84" },
              { "type": "text", "text": "\\text{Step 1: } (1 + 2) = 3", "x": 520, "y": 120, "size": 24, "color": "#3DDC84" }
            ]
          },
          {
            "narration": "Next, modern order of operations evaluates left to right: 6 divided by 2 is 3.",
            "draw": [
              { "type": "arrow", "x1": 248, "y1": 155, "x2": 248, "y2": 195, "color": "#38BDF8" },
              { "type": "text", "text": "6 \\div 2(3)", "x": 100, "y": 220, "size": 32, "color": "#F8FAFC" },
              { "type": "underline", "x": 95, "y": 242, "w": 90, "color": "#38BDF8" },
              { "type": "text", "text": "\\text{Step 2: } 6 \\div 2 = 3", "x": 520, "y": 220, "size": 24, "color": "#38BDF8" }
            ]
          },
          {
            "narration": "Finally, multiply 3 times 3 to reach the modern standard result of 9.",
            "draw": [
              { "type": "arrow", "x1": 140, "y1": 255, "x2": 140, "y2": 295, "color": "#3DDC84" },
              { "type": "text", "text": "= 3(3) = 9", "x": 100, "y": 320, "size": 34, "color": "#3DDC84" },
              { "type": "rect", "x": 260, "y": 295, "w": 44, "h": 50, "color": "#3DDC84" },
              { "type": "check", "x": 318, "y": 302, "size": 36, "color": "#3DDC84" },
              { "type": "text", "text": "\\text{Step 3: } 3(3) = 9", "x": 520, "y": 320, "size": 24, "color": "#3DDC84" }
            ]
          }
        ]
      },

      pythagoras: {
        "steps": [
          {
            "narration": "Consider a right triangle with legs a and b, and hypotenuse c.",
            "draw": [
              { "type": "triangle", "points": [[160, 420], [440, 420], [160, 160]], "color": "#FACC15" },
              { "type": "right_angle_marker", "x": 160, "y": 420, "size": 22, "dirX": 1, "dirY": -1, "color": "#38BDF8" },
              { "type": "text", "text": "a = 3", "x": 90, "y": 290, "size": 24, "color": "#FACC15" },
              { "type": "text", "text": "b = 4", "x": 275, "y": 460, "size": 24, "color": "#FACC15" },
              { "type": "text", "text": "c = ?", "x": 315, "y": 270, "size": 26, "color": "#3DDC84" }
            ]
          },
          {
            "narration": "By the Pythagorean Theorem, the sum of the squares of the legs equals the hypotenuse squared.",
            "draw": [
              { "type": "highlight", "x": 512, "y": 138, "w": 230, "h": 44, "color": "#FACC15" },
              { "type": "text", "text": "a^2 + b^2 = c^2", "x": 520, "y": 160, "size": 30, "color": "#F8FAFC" },
              { "type": "text", "text": "3^2 + 4^2 = 9 + 16 = 25", "x": 520, "y": 250, "size": 24, "color": "#BAE6FD" }
            ]
          },
          {
            "narration": "Taking the square root, the hypotenuse c equals 5.",
            "draw": [
              { "type": "text", "text": "c = \\sqrt{25} = 5", "x": 520, "y": 350, "size": 32, "color": "#3DDC84" },
              { "type": "rect", "x": 640, "y": 325, "w": 75, "h": 50, "color": "#3DDC84" },
              { "type": "check", "x": 735, "y": 330, "size": 38, "color": "#3DDC84" }
            ]
          }
        ]
      },

      quadratic: {
        "steps": [
          {
            "narration": "Here is the standard quadratic function f(x) equals x squared minus 4.",
            "draw": [
              { "type": "axes", "originX": 250, "originY": 340, "lengthX": 180, "lengthY": 200, "color": "#94A3B8" },
              { "type": "path", "points": [[130, 160], [190, 260], [250, 420], [310, 260], [370, 160]], "color": "#38BDF8", "strokeWidth": 3 },
              { "type": "text", "text": "f(x) = x^2 - 4", "x": 520, "y": 140, "size": 30, "color": "#F8FAFC" }
            ]
          },
          {
            "narration": "The roots occur where f(x) equals zero, factoring into x minus 2 times x plus 2.",
            "draw": [
              { "type": "point", "x": 190, "y": 340, "label": "(-2, 0)", "color": "#F472B6" },
              { "type": "point", "x": 310, "y": 340, "label": "(2, 0)", "color": "#F472B6" },
              { "type": "text", "text": "x^2 - 4 = 0", "x": 520, "y": 220, "size": 26, "color": "#F8FAFC" },
              { "type": "text", "text": "(x - 2)(x + 2) = 0", "x": 520, "y": 300, "size": 26, "color": "#3DDC84" },
              { "type": "brace", "x": 520, "y": 335, "w": 240, "orientation": "bottom", "label": "two roots", "color": "#38BDF8" },
              { "type": "text", "text": "x = 2 \\quad\\text{or}\\quad x = -2", "x": 520, "y": 410, "size": 28, "color": "#3DDC84" },
              { "type": "check", "x": 820, "y": 395, "size": 36, "color": "#3DDC84" }
            ]
          }
        ]
      },

      geometry: {
        "steps": [
          {
            "narration": "An angle arc highlights the 45 degree angle between the two rays.",
            "draw": [
              { "type": "line", "x1": 150, "y1": 360, "x2": 450, "y2": 360, "color": "#94A3B8" },
              { "type": "line", "x1": 150, "y1": 360, "x2": 362, "y2": 148, "color": "#94A3B8" },
              { "type": "angle_arc", "cx": 150, "cy": 360, "r": 70, "start": -0.785, "end": 0, "label": "45°", "color": "#FACC15" },
              { "type": "text", "text": "\\theta = 45^\\circ = \\frac{\\pi}{4}\\text{ rad}", "x": 480, "y": 200, "size": 28, "color": "#38BDF8" },
              { "type": "text", "text": "\\sin(45^\\circ) = \\frac{\\sqrt{2}}{2}", "x": 480, "y": 280, "size": 26, "color": "#F8FAFC" },
              { "type": "text", "text": "\\cos(45^\\circ) = \\frac{\\sqrt{2}}{2}", "x": 480, "y": 360, "size": 26, "color": "#3DDC84" }
            ]
          }
        ]
      },

      numberline: {
        "steps": [
          {
            "narration": "On a number line, we plot integers and mark the solution set for x greater than or equal to 2.",
            "draw": [
              { "type": "number_line", "x": 100, "y": 320, "length": 800, "min": -4, "max": 4, "color": "#38BDF8" },
              { "type": "point", "x": 500, "y": 320, "label": "0", "color": "#FACC15" },
              { "type": "point", "x": 700, "y": 320, "label": "x = 2", "color": "#3DDC84" },
              { "type": "highlight", "x": 435, "y": 140, "w": 140, "h": 48, "color": "#3DDC84" },
              { "type": "text", "text": "x \\ge 2", "x": 450, "y": 165, "size": 36, "color": "#3DDC84" },
              { "type": "arrow", "x1": 700, "y1": 270, "x2": 900, "y2": 270, "color": "#3DDC84" }
            ]
          }
        ]
      }
    };

    const svgEl = document.getElementById('wbSvg');
    const jsonInput = document.getElementById('jsonInput');
    const presetSelect = document.getElementById('presetSelect');
    const statusMsg = document.getElementById('statusMsg');
    const narrationText = document.getElementById('narrationText');
    const stepCounter = document.getElementById('stepCounter');
    const dbgPlayBtn = document.getElementById('dbgPlayBtn');
    const dbgPrevBtn = document.getElementById('dbgPrevBtn');
    const dbgNextBtn = document.getElementById('dbgNextBtn');
    const dbgClearBtn = document.getElementById('dbgClearBtn');
    const durationSlider = document.getElementById('durationSlider');
    const durationVal = document.getElementById('durationVal');
    const screenHlBadge = document.getElementById('screenHlBadge');
    const screenHlText = document.getElementById('screenHlText');

    let currentDuration = 3200;

    const player = new WhiteboardPlayer(svgEl, {
      defaultStepDurationMs: currentDuration,
      onStepStart: (index, step, dur) => {
        stepCounter.textContent = `Step ${index + 1}/${player.steps.length}`;
        narrationText.textContent = step.narration || '';
        dbgPlayBtn.textContent = '⏸ Pause';
      },
      onAllComplete: () => {
        dbgPlayBtn.textContent = '🔄 Replay';
      }
    });

    window.addEventListener('flinch-screen-highlight', (e) => {
      const b = e.detail;
      screenHlBadge.style.display = 'flex';
      screenHlText.textContent = `Screen Target: [x:${Math.round(b.x*100)}%, y:${Math.round(b.y*100)}%, w:${Math.round(b.w*100)}%, h:${Math.round(b.h*100)}%]`;
    });

    function loadPreset(key) {
      const data = PRESETS[key] || PRESETS.pemdas;
      jsonInput.value = JSON.stringify(data, null, 2);
      validateAndLoad();
    }

    function validateAndLoad() {
      try {
        const parsed = JSON.parse(jsonInput.value);
        if (!parsed.steps || !Array.isArray(parsed.steps)) {
          throw new Error("Missing 'steps' array at root level.");
        }
        statusMsg.textContent = `✓ Valid JSON with ${parsed.steps.length} step(s)`;
        statusMsg.className = 'debug-status ok';
        player.load(parsed);
        stepCounter.textContent = `Step 0/${parsed.steps.length}`;
        narrationText.textContent = 'Click "Play Animation" to test this solution...';
        screenHlBadge.style.display = 'none';
        return true;
      } catch (err) {
        statusMsg.textContent = '✗ ' + err.message;
        statusMsg.className = 'debug-status';
        return false;
      }
    }

    presetSelect.addEventListener('change', (e) => loadPreset(e.target.value));
    jsonInput.addEventListener('input', () => validateAndLoad());

    durationSlider.addEventListener('input', (e) => {
      currentDuration = parseInt(e.target.value, 10);
      durationVal.textContent = (currentDuration / 1000).toFixed(1) + 's';
      player.options.defaultStepDurationMs = currentDuration;
    });

    dbgPlayBtn.addEventListener('click', () => {
      if (player.isPlaying) {
        player.pause();
        dbgPlayBtn.textContent = '▶ Resume';
      } else {
        if (validateAndLoad()) {
          player.play();
        }
      }
    });

    dbgPrevBtn.addEventListener('click', () => player.prevStep());
    dbgNextBtn.addEventListener('click', () => player.nextStep());
    dbgClearBtn.addEventListener('click', () => {
      player.stop();
      player.clear();
      dbgPlayBtn.textContent = '▶ Play Animation';
      narrationText.textContent = 'Cleared. Ready to play...';
      screenHlBadge.style.display = 'none';
    });

    // Initial load
    loadPreset('pemdas');
  </script>
</body>
</html>
